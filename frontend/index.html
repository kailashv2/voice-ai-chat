<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voice AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    h1 { margin-bottom: 10px; font-size: 2rem; }
    p { color: #888; margin-bottom: 40px; }
    #btn { width: 100px; height: 100px; border-radius: 50%; border: none; background: #6c63ff; cursor: pointer; font-size: 2rem; transition: all 0.2s; }
    #btn.recording { background: #ff4444; transform: scale(1.1); }
    #btn:disabled { background: #444; cursor: not-allowed; }
    #status { margin-top: 20px; color: #888; font-size: 0.9rem; }
    #transcript { margin-top: 30px; max-width: 500px; text-align: center; }
    #transcript .you { color: #6c63ff; margin-bottom: 8px; }
    #transcript .ai { color: #00e5a0; }
  </style>
</head>
<body>
  <h1>🎤 Voice AI</h1>
  <p>Press and hold to talk</p>
  <button id="btn">🎤</button>
  <div id="status">Ready</div>
  <div id="transcript">
    <div class="you" id="you"></div>
    <div class="ai" id="ai"></div>
  </div>

  <script>
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const youEl = document.getElementById("you");
    const aiEl = document.getElementById("ai");

    let mediaRecorder, chunks = [], stream;

    btn.addEventListener("mousedown", startRecording);
    btn.addEventListener("mouseup", stopRecording);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecording(); });

    async function startRecording() {
      if (btn.disabled) return;
      chunks = [];
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 }
        });
        const mimeType = MediaRecorder.isTypeSupported('audio/mp4')
          ? 'audio/mp4'
          : MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus'
          : 'audio/webm';
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.start(250);
        btn.classList.add("recording");
        status.textContent = "Recording... (release to send)";
      } catch (err) {
        status.textContent = "Mic access denied!";
      }
    }

    async function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return;
      mediaRecorder.stop();
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove("recording");
      btn.disabled = true;
      status.textContent = "Processing...";

      mediaRecorder.onstop = async () => {
        const mimeType = mediaRecorder.mimeType || "audio/webm";
        const ext = mimeType.includes("mp4") ? "mp4" : "webm";
        const blob = new Blob(chunks, { type: mimeType });

        if (blob.size < 1000) {
          status.textContent = "Too short — try again!";
          btn.disabled = false;
          return;
        }

        const formData = new FormData();
        formData.append("audio", blob, "audio." + ext);

        try {
          status.textContent = "AI is thinking...";
          const res = await fetch("/talk", {
            method: "POST",
            body: formData
          });

          if (!res.ok) throw new Error("Server error");

          const audioBlob = await res.blob();
          const userText = decodeURIComponent(res.headers.get("X-Transcript") || "");
          const aiText = decodeURIComponent(res.headers.get("X-Reply") || "");

          youEl.textContent = "You: " + userText;
          aiEl.textContent = "AI: " + aiText;

          status.textContent = "AI is speaking...";
          const audio = new Audio(URL.createObjectURL(audioBlob));
          audio.onended = () => { status.textContent = "Ready"; btn.disabled = false; };
          audio.play();
        } catch (err) {
          status.textContent = "Error — try again!";
          btn.disabled = false;
        }
      };
    }
  </script>
</body>
</html>
